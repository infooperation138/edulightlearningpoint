<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mangalayatan University (Online)</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<section class="py-5">

<div class="container">

<div class="row">

<!-- LEFT SIDE -->

<div class="col-lg-8">

<img src="images/universities/mangalayatanonline.png"
class="img-fluid mb-4"
style="max-width:180px;">

<h2 class="fw-bold">

Mangalayatan University (Online)

</h2>

<p class="text-muted">

UGC Approved Online Degree Programs

</p>

<hr>

<h4>About University</h4>

<p>

Mangalayatan University offers UGC entitled Online Degree
Programs with flexible learning, digital study material,
online classes and placement assistance.

</p>

<hr>

<h4 class="fw-bold mt-4 mb-3">
Available Programs
</h4>

<div id="courseList">

</div>

</div>

<!-- RIGHT SIDE -->

<div class="col-lg-4">

<div class="admission-form-box">

<h4 class="text-center mb-3">

Apply Now

</h4>

<form id="admissionForm">

<input type="hidden"
id="university"
name="university"
value="Mangalayatan University (Online)">

<input
type="text"
class="form-control mb-3"
name="name"
placeholder="Full Name"
required>

<input
type="tel"
class="form-control mb-3"
name="mobile"
placeholder="Mobile Number"
required>

<input
type="email"
class="form-control mb-3"
name="email"
placeholder="Email Address"
required>

<select
id="category"
name="category"
class="form-select mb-3"
required>

<option value="">

Select Category

</option>

<option value="UG">

UG

</option>

<option value="PG">

PG

</option>

</select>

<select
id="course"
name="course"
class="form-select mb-3"
required>

<option value="">

Select Course

</option>

</select>

<select
id="stream"
name="stream"
class="form-select mb-3"
required>

<option value="">

Select Stream

</option>

</select>

<button
class="btn btn-primary w-100">

Apply Now

</button>

</form>

</div>

</div>

</div>

</div>

</section>

<script src="js/script.js"></script>

</body>

</html>
